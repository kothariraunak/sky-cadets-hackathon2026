# Fly.io config — one machine runs Django (API + built React app) with SQLite on a volume.
app = "skycadets"
primary_region = "sin"

[build]

[env]
  DEBUG = "0"
  SQLITE_PATH = "/data/db.sqlite3"
  MEDIA_ROOT = "/data/media"
  ALLOWED_HOSTS = "skycadets.fly.dev"
  CSRF_TRUSTED_ORIGINS = "https://skycadets.fly.dev"

# SQLite lives here so data survives deploys. Keep a single machine: SQLite can't be shared.
[[mounts]]
  source = "skycadets_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
